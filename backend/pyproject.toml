[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "motorloop-api"
version = "0.1.0"
description = "Motorloop modular marketplace API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "geoalchemy2>=0.17,<1", "redis>=5.2,<7",
  "celery[redis]>=5.4,<6", "PyJWT>=2.10,<3", "boto3>=1.36,<2",
  "pillow>=11,<13", "prometheus-client>=0.21,<1", "structlog>=25,<27",
  "sentry-sdk[fastapi]>=2.20,<3", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-boto3[s3]>=1.36,<2", "types-Pillow>=10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL/PostGIS, Redis and object storage"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "geoalchemy2.*"]
ignore_missing_imports = true
