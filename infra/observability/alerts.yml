groups:
  - name: motorloop
    rules:
      - alert: ApiUnavailable
        expr: up{job="motorloop-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Motorloop API is unavailable"}
      - alert: ApiErrorRatio
        expr: sum(rate(motorloop_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(motorloop_http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 5% of API requests are failing"}
      - alert: UploadBacklog
        expr: motorloop_outbox_oldest_seconds > 120
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Oldest pending background work exceeds two minutes"}
      - alert: DeadLetters
        expr: motorloop_dead_letters > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Inspect and replay failed background work"}
