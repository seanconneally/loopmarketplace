limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # Development storage uses localhost:9000. Tighten origins and enable HTTPS for release.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:9000; media-src 'self' blob: http://localhost:9000; connect-src 'self' ws://localhost:8080 http://localhost:9000; worker-src 'self' blob:; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 "ok"; }
    location = /metrics { deny all; }
    error_page 429 = @rate_error;
    location @rate_error {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Please slow down and try again.","request_id":"$request_id"}}';
    }
    error_page 413 = @payload_error;
    location @payload_error {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"This request is too large.","request_id":"$request_id"}}';
    }
    location /health/ { proxy_pass http://api:8000; }
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location /media/ {
        proxy_pass http://storage:9000/playback/;
        proxy_set_header Host storage:9000;
        add_header Cache-Control "public,max-age=300";
    }
    location /assets/ { expires 1y; add_header Cache-Control "public,immutable"; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
