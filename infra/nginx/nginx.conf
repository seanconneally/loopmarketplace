limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;
    proxy_hide_header Server;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/security-headers.conf;
    # Never serve dotfiles, repository internals, maps, credentials or backup files.
    location ~ (^|/)\. { return 404; }
    location ~* \.(map|sql|sqlite3?|bak|old|log|pem|key|env|ini|toml)(/|$) { return 404; }
    location = /healthz { access_log off; return 200 "ok"; }
    location = /metrics { deny all; }
    error_page 429 = @rate_error;
    location @rate_error {
        include /etc/nginx/security-headers.conf;
        add_header Retry-After 60 always;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Please slow down and try again.","request_id":"$request_id"}}';
    }
    error_page 413 = @payload_error;
    location @payload_error {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"This request is too large.","request_id":"$request_id"}}';
    }
    location /health/ { proxy_pass http://api:8000; }
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location /media/ {
        # Public playback is read-only; source/quarantine buckets have no gateway route.
        if ($uri !~ "^/media/[0-9a-f-]{36}/(v[1-9][0-9]*/)?(master\.m3u8|poster\.jpg|thumbnails\.jpg|(640|1280)/(index\.m3u8|[0-9]{4}\.ts))$") { return 404; }
        if ($args != "") { return 404; }
        limit_except GET HEAD { deny all; }
        proxy_pass http://storage:9000/playback/;
        proxy_set_header Host storage:9000;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public,max-age=300";
    }
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public,immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
