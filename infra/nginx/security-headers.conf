# Include wherever add_header is used: Nginx otherwise drops inherited headers.
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Content-Type-Options nosniff always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# Local multipart uploads use localhost:9000. HTTPS and release origins remain release gates.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:9000; media-src 'self' blob: http://localhost:9000; connect-src 'self' ws://localhost:8080 http://localhost:9000; worker-src 'self' blob:; frame-ancestors 'none'" always;
