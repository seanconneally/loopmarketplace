services:
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-only
    volumes:
      - ./infra/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./infra/observability/grafana-provider.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./infra/observability/dashboard.json:/var/lib/grafana/dashboards/motorloop.json:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
